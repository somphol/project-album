<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 12% 0%, #1d2a44 0%, #0b0f18 55%, #07090f 100%);
    color: #e8edf7;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 44px 52px 40px;
  }
  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; }
  h1 { font-size: 40px; letter-spacing: -0.02em; font-weight: 650; }
  h1 span { color: #6ea8ff; }
  p { color: #93a3bd; font-size: 16px; margin-top: 8px; letter-spacing: 0.01em; }
  .count { font-size: 14px; color: #93a3bd; }
  .count b { color: #e8edf7; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 16px; height: 810px; }
  figure { position: relative; overflow: hidden; border-radius: 14px; background: #11151f;
           border: 1px solid rgba(255,255,255,.12); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { position: absolute; left: 12px; bottom: 12px; padding: 7px 11px; border-radius: 8px;
               background: rgba(8,11,18,.78); border: 1px solid rgba(255,255,255,.14);
               font-size: 13px; letter-spacing: .01em; backdrop-filter: blur(6px); }
</style>
</head>
<body>
  <header>
    <div>
      <h1>OpenCode <span>Skills</span></h1>
      <p>Reusable build studios, packaged as an HTTP skill catalog.</p>
    </div>
    <div class="count"><b>22</b> skills · one URL</div>
  </header>
  <div class="grid">
    <figure><img src="../../opencode-skills/cute3d-animal-studio/assets/preview.png"><figcaption>Cute3D Animal Studio</figcaption></figure>
    <figure><img src="../../opencode-skills/city-3d-tour-guide/preview.jpg"><figcaption>City 3D Tour Guide</figcaption></figure>
    <figure><img src="../../opencode-skills/algorithm-explorer-studio/assets/preview.png"><figcaption>Algorithm Explorer</figcaption></figure>
    <figure><img src="../../opencode-skills/lucky-draw-3d-studio/assets/preview.png"><figcaption>Lucky Draw 3D</figcaption></figure>
    <figure><img src="../../opencode-skills/wurlitzer-lullaby-studio/assets/preview.png"><figcaption>Wurlitzer Lullaby</figcaption></figure>
    <figure><img src="../../opencode-skills/vu-project-ideas-studio/assets/preview.png"><figcaption>VU Project Ideas</figcaption></figure>
  </div>
</body>
</html>
